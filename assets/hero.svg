<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Paul Foulon">
  <defs>
    <!-- trame de points -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="1" cy="1" r="1"/>
    </pattern>
    <!-- masque radial : visible au centre, s'estompe vers les bords -->
    <radialGradient id="fadeMask" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade"><rect width="800" height="300" fill="url(#fadeMask)"/></mask>
    <!-- reflet qui glisse sur le nom -->
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="inkA" offset="0%"/>
      <stop class="inkB" offset="50%"/>
      <stop class="inkA" offset="100%"/>
      <animate attributeName="x1" values="-100%;0%;-100%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;0%"   dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    :root { --ink: #8b949e; --ink2: #6e7781; --line: #8b949e; --dot: #8b949e; }
    @media (prefers-color-scheme: light) { :root { --ink: #1f2328; --ink2: #6e7781; --line: #8c959f; --dot: #6e7781; } }
    @media (prefers-color-scheme: dark)  { :root { --ink: #e6edf3; --ink2: #8b949e; --line: #8b949e; --dot: #8b949e; } }

    .dot  { fill: var(--dot); opacity: .35; }
    .inkA { stop-color: var(--ink); }
    .inkB { stop-color: var(--ink2); }
    .ring { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 145; stroke-dashoffset: 145;
            animation: draw 1.4s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
            font-size: 14px; font-weight: 500; letter-spacing: 3px; fill: var(--ink2); opacity: 0;
            animation: fade 1s ease 1.1s forwards; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
            font-size: 60px; font-weight: 600; letter-spacing: -2px; fill: url(#ink); opacity: 0;
            animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .9s forwards; }
    .grid { opacity: 0; animation: fade 2s ease .4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>

  <rect class="grid" width="800" height="300" fill="url(#dots)" mask="url(#fade)"/>

  <circle class="ring" cx="400" cy="92" r="23" transform="rotate(-90 400 92)"/>
  <text class="mono" x="401.5" y="97" text-anchor="middle">PF</text>

  <text class="name" x="400" y="200" text-anchor="middle">Paul Foulon</text>
</svg>
