<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40" role="img" aria-label="mail">
  <style>
    /* valeurs neutres, lisibles sur fond clair comme sombre */
    .b { fill: none; stroke: #8b949e; stroke-opacity: .45; }
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 1.5px; fill: #8b949e; }
    @media (prefers-color-scheme: light) {
      .b { fill: #f6f8fa; stroke: #d0d7de; stroke-opacity: 1; }
      .t { fill: #424a53; }
    }
    @media (prefers-color-scheme: dark) {
      .b { fill: #161b22; stroke: #30363d; stroke-opacity: 1; }
      .t { fill: #c9d1d9; }
    }
  </style>
  <rect class="b" x="0.5" y="0.5" width="119" height="39" rx="19.5"/>
  <text class="t" x="60" y="24.5" text-anchor="middle">mail</text>
</svg>
