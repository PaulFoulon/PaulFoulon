<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="Paul Foulon">
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 200;
      letter-spacing: 10px;
      fill: #e6edf3;
      opacity: 0;
      animation: rise 1.4s cubic-bezier(.2,.7,.2,1) .15s forwards;
    }
    .rule {
      stroke: #30363d;
      stroke-width: 1;
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: draw 1.2s cubic-bezier(.2,.7,.2,1) .9s forwards;
    }
    .dot {
      fill: #8b949e;
      opacity: 0;
      animation: pulse 3.2s ease-in-out 2s infinite;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse {
      0%, 100% { opacity: .25; }
      50%      { opacity: 1; }
    }
  </style>
  <text class="name" x="320" y="98" text-anchor="middle">PAUL FOULON</text>
  <line class="rule" x1="260" y1="134" x2="380" y2="134" stroke-linecap="round"/>
  <circle class="dot" cx="320" cy="134" r="2.5"/>
</svg>
