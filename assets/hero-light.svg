<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="Paul Foulon">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1f2328"/>
      <stop offset="50%"  stop-color="#6e7781"/>
      <stop offset="100%" stop-color="#1f2328"/>
      <animate attributeName="x1" values="-100%;0%;-100%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;0%"   dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8c959f" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#8c959f" stop-opacity="1"/>
      <stop offset="1"   stop-color="#8c959f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      font-size: 64px; font-weight: 600; letter-spacing: -2px;
      fill: url(#ink); opacity: 0;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards;
    }
    .rule { opacity: 0; animation: fade 1.2s ease 1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
  </style>

  <text class="name" x="400" y="130" text-anchor="middle">Paul Foulon</text>
  <rect class="rule" x="300" y="166" width="200" height="1" fill="url(#rule)"/>
</svg>
